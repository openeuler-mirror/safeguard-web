[pytest]
DJANGO_SETTINGS_MODULE = safeguard_web.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = backend/tests
addopts =
    --strict-markers
    --tb=short
    -v
markers =
    p0: P0 优先级测试
    p1: P1 优先级测试
    p2: P2 优先级测试
    slow: 慢速测试
    integration: 集成测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
